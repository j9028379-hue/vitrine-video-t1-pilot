name: Test T1 — Bamaki Shalom — GitHub runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bamaki-shalom-riz-au-gras-calavi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-bamaki-shalom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the isolated test branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install the canonical renderer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install -r requirements.txt jsonschema==4.23.0 scipy==1.15.2
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Verify the immutable T1 template and approved music pack
        run: |
          set -euo pipefail
          echo '5a742abf8307b6347d28e6eb7d540b8d17e88482c3548422affa8e54c38d7b1b  config/T1_special_menu_template_v1_0_0.json' | sha256sum --check --strict
          python - <<'PY'
          import json
          from pathlib import Path
          pack = json.loads(Path('config/T1_special_menu_music_pack_v1_0_0.json').read_text())
          ids = [track['id'] for track in pack['tracks']]
          assert ids == ['t1_music_239426', 't1_music_464383', 't1_music_406552', 't1_music_178406']
          assert all(track['pixabay_id'] != 573944 for track in pack['tracks'])
          print('MUSIC_PACK_OK', ids)
          PY

      - name: Create the confirmed Bamaki Shalom merchant input
        run: |
          set -euo pipefail
          mkdir -p work/source work/media work/output release
          cat > work/T1_bamaki_shalom_input.json <<'JSON'
          {
            "nom": "BAMAKI SHALOM",
            "produit": "RIZ AU GRAS",
            "prix": "35 000",
            "whatsapp": "01 63 57 88 31",
            "quartier": "CALAVI"
          }
          JSON
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from engine.special_menu_style import load_json, normalize_fields, validate_config
          config = load_json(Path('config/T1_special_menu_template_v1_0_0.json'))
          raw = load_json(Path('work/T1_bamaki_shalom_input.json'))
          validate_config(config)
          fields = normalize_fields(raw, config)
          assert fields == {
              'nom': 'BAMAKI SHALOM',
              'produit': 'RIZ AU GRAS',
              'prix': '35 000',
              'whatsapp': '01 63 57 88 31',
              'quartier': 'CALAVI',
              'accroche': '',
          }
          print(json.dumps(fields, ensure_ascii=False, indent=2))
          PY

      - name: Download the four licensed stock sources on the GitHub runner
        run: |
          set -euo pipefail
          download() {
            local url="$1" target="$2"
            curl --location --fail --silent --show-error \
              --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
              --user-agent 'Mozilla/5.0 GitHub-Actions-T1-Test' \
              "$url" --output "$target"
            test -s "$target"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,duration -of json "$target"
          }
          download 'https://videos.pexels.com/video-files/13132696/13132696-uhd_2560_1440_60fps.mp4' work/source/S1_rice.mp4
          download 'https://videos.pexels.com/video-files/7817118/7817118-uhd_1440_2560_30fps.mp4' work/source/S2_rice_top_details.mp4
          download 'https://videos.pexels.com/video-files/5657164/5657164-uhd_2732_1440_30fps.mp4' work/source/S3_serving.mp4
          download 'https://videos.pexels.com/video-files/5293716/5293716-hd_1920_1080_30fps.mp4' work/source/S4_facade_stock.mp4
          sha256sum work/source/* | tee work/source/SHA256SUMS.txt

      - name: Prepare exact scene rushes on the GitHub runner
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          W, H = 688, 164
          sign = Image.new('RGBA', (W, H), (22, 18, 13, 255))
          draw = ImageDraw.Draw(sign)
          draw.rectangle((2, 2, W - 3, H - 3), outline=(235, 184, 66, 255), width=5)
          serif = ImageFont.truetype('assets/fonts/DMSerifDisplay-Regular.ttf', 61)
          sans = ImageFont.truetype('assets/fonts/Montserrat-Variable.ttf', 22)
          title = 'BAMAKI SHALOM'
          box = draw.textbbox((0, 0), title, font=serif)
          draw.text(((W - (box[2] - box[0])) / 2, 25), title, font=serif, fill=(255, 246, 218, 255))
          sub = 'RESTAURANT  ·  CALAVI'
          box = draw.textbbox((0, 0), sub, font=sans)
          draw.text(((W - (box[2] - box[0])) / 2, 116), sub, font=sans, fill=(235, 184, 66, 255))
          sign.save('work/sign_overlay.png')

          notice = Image.new('RGBA', (688, 58), (15, 15, 15, 225))
          draw = ImageDraw.Draw(notice)
          font = ImageFont.truetype('assets/fonts/Montserrat-Variable.ttf', 21)
          text = 'SIMULATION VISUELLE · RUSH STOCK'
          box = draw.textbbox((0, 0), text, font=font)
          draw.text(((688 - (box[2] - box[0])) / 2, 15), text, font=font, fill=(255, 245, 220, 255))
          notice.save('work/simulation_notice.png')
          PY

          common=(-c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -profile:v main -level 4.0 -c:a aac -profile:a aac_low -b:a 128k -ar 48000 -ac 2 -movflags +faststart)

          ffmpeg -hide_banner -loglevel error -y -ss 2.0 -i work/source/S1_rice.mp4 -f lavfi -i anullsrc=r=48000:cl=stereo \
            -map 0:v:0 -map 1:a:0 -vf 'fps=30,scale=-2:1280:flags=lanczos,crop=720:1280' \
            -frames:v 180 -t 6 "${common[@]}" work/media/S1.mp4

          ffmpeg -hide_banner -loglevel error -y -i work/source/S2_rice_top_details.mp4 -f lavfi -i anullsrc=r=48000:cl=stereo \
            -map 0:v:0 -map 1:a:0 -vf 'tpad=stop_mode=clone:stop_duration=0.3,fps=30,scale=-2:1280:flags=lanczos,crop=720:1280' \
            -frames:v 240 -t 8 "${common[@]}" work/media/S2.mp4

          ffmpeg -hide_banner -loglevel error -y -ss 5.0 -i work/source/S3_serving.mp4 -f lavfi -i anullsrc=r=48000:cl=stereo \
            -map 0:v:0 -map 1:a:0 -vf 'fps=30,scale=-2:1280:flags=lanczos,crop=720:1280' \
            -frames:v 210 -t 7 "${common[@]}" work/media/S3.mp4

          ffmpeg -hide_banner -loglevel error -y -ss 3.0 -i work/source/S4_facade_stock.mp4 \
            -i work/sign_overlay.png -i work/simulation_notice.png -f lavfi -i anullsrc=r=48000:cl=stereo \
            -filter_complex '[0:v]fps=30,scale=-2:1280:flags=lanczos,crop=720:1280,gblur=sigma=16,eq=brightness=-0.12:saturation=0.45[base];[base][1:v]overlay=16:400:eof_action=repeat[signed];[signed][2:v]overlay=16:40:eof_action=repeat[v]' \
            -map '[v]' -map 3:a:0 -frames:v 270 -t 9 "${common[@]}" work/media/S4.mp4

      - name: Validate the four immutable scene contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          expected = {'S1': 180, 'S2': 240, 'S3': 210, 'S4': 270}
          for scene, frames in expected.items():
              path = f'work/media/{scene}.mp4'
              data = json.loads(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_streams', '-show_format', '-of', 'json', path
              ], text=True))
              video = next(s for s in data['streams'] if s['codec_type'] == 'video')
              audio = next(s for s in data['streams'] if s['codec_type'] == 'audio')
              assert int(video['nb_frames']) == frames, (scene, video['nb_frames'])
              assert video['width'] == 720 and video['height'] == 1280
              assert video['r_frame_rate'] == '30/1'
              assert video['codec_name'] == 'h264' and video['profile'] == 'Main'
              assert audio['codec_name'] == 'aac' and audio['profile'] == 'LC'
              assert audio['sample_rate'] == '48000' and audio['channels'] == 2
              assert abs(float(data['format']['duration']) - frames / 30) <= 0.001
              print('SCENE_CONTRACT_OK', scene, frames)
          PY

      - name: Execute the canonical T1 engine with the published template
        run: |
          set -euo pipefail
          PYTHONPATH=. python tools/render_t1_special_menu_v3.py \
            --config config/T1_special_menu_template_v1_0_0.json \
            --input work/T1_bamaki_shalom_input.json \
            --media-dir work/media \
            --output work/output/T1_BAMAKI_SHALOM_SILENT.mp4 \
            --contact-sheet release/T1_BAMAKI_SHALOM_CONTACT_SHEET.jpg \
            --manifest release/T1_BAMAKI_SHALOM_RENDER_MANIFEST.json

      - name: Add the approved local music variant without changing the rendered video stream
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -i audio/music/t1-afrobeat-amapiano-v1/t1_239426_120bpm_30s.mp3 \
            -t 30 -af 'volume=-3dB,afade=t=in:st=0:d=0.12,afade=t=out:st=29.55:d=0.45' \
            -ar 48000 -ac 2 -c:a pcm_s24le work/output/music_239426.wav
          ffmpeg -hide_banner -loglevel error -y \
            -i work/output/T1_BAMAKI_SHALOM_SILENT.mp4 -i work/output/music_239426.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -ar 48000 -ac 2 -t 30 \
            -map_metadata -1 -movflags +faststart release/VIDEO_T1_BAMAKI_SHALOM_RIZ_AU_GRAS_CALAVI.mp4
          test "$(ffmpeg -v error -i work/output/T1_BAMAKI_SHALOM_SILENT.mp4 -map 0:v:0 -c copy -f hash -hash sha256 -)" = \
               "$(ffmpeg -v error -i release/VIDEO_T1_BAMAKI_SHALOM_RIZ_AU_GRAS_CALAVI.mp4 -map 0:v:0 -c copy -f hash -hash sha256 -)"

      - name: Run final objective QC and write the GitHub-server report
        run: |
          set -euo pipefail
          ffmpeg -v error -i release/VIDEO_T1_BAMAKI_SHALOM_RIZ_AU_GRAS_CALAVI.mp4 -map 0:v:0 -f null - -map 0:a:0 -f null -
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          video_path = Path('release/VIDEO_T1_BAMAKI_SHALOM_RIZ_AU_GRAS_CALAVI.mp4')
          probe = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error', '-show_streams', '-show_format', '-of', 'json', str(video_path)
          ], text=True))
          video = next(s for s in probe['streams'] if s['codec_type'] == 'video')
          audio = next(s for s in probe['streams'] if s['codec_type'] == 'audio')
          assert int(video['nb_frames']) == 900
          assert video['width'] == 720 and video['height'] == 1280 and video['r_frame_rate'] == '30/1'
          assert abs(float(probe['format']['duration']) - 30.0) <= 0.001
          assert audio['codec_name'] == 'aac' and audio['profile'] == 'LC'
          assert audio['sample_rate'] == '48000' and audio['channels'] == 2
          sha = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          sources = {
              path.name: sha(path) for path in sorted(Path('work/source').glob('*.mp4'))
          }
          report = {
              'status': 'PASS',
              'render_location': 'GitHub Actions ubuntu-latest',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'commit': os.environ['GITHUB_SHA'],
              'branch': os.environ['GITHUB_REF_NAME'],
              'engine': 'engine.special_menu_style.render_project',
              'template': 'config/T1_special_menu_template_v1_0_0.json',
              'merchant_fields': {
                  'nom': 'BAMAKI SHALOM',
                  'produit': 'RIZ AU GRAS',
                  'prix': '35 000 FCFA',
                  'whatsapp': '01 63 57 88 31',
                  'quartier': 'CALAVI',
              },
              'scene_contract': {'S1': 180, 'S2': 240, 'S3': 210, 'S4': 270},
              'frames': 900,
              'fps': 30,
              'duration_s': 30.0,
              'width': 720,
              'height': 1280,
              'music_variant': 't1_music_239426',
              'voice': False,
              'ai_generated_image_used': False,
              'stock_sources_are_real_bamaki_shalom': False,
              's4_is_explicit_simulation': True,
              'stable_release_modified': False,
              'source_sha256': sources,
              'final_video': {
                  'file': video_path.name,
                  'sha256': sha(video_path),
                  'bytes': video_path.stat().st_size,
              },
              'probe': probe,
          }
          Path('release/T1_BAMAKI_SHALOM_GITHUB_QC.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cp work/T1_bamaki_shalom_input.json release/
          cat > release/AVERTISSEMENT_RUSHS_STOCK.txt <<'EOF'
          Ce rendu est un test T1 généré intégralement sur GitHub Actions.
          Les scènes utilisent des rushs stock Pexels et ne représentent pas les locaux réels de Bamaki Shalom.
          S4 est volontairement floutée et porte la mention « SIMULATION VISUELLE · RUSH STOCK ».
          Aucune image générée par intelligence artificielle n'a été utilisée.
          EOF
          cat > release/SOURCES_PEXELS.md <<'EOF'
          # Sources stock du test

          - S1 — riz : https://www.pexels.com/video/close-up-of-food-13132696/
          - S2 — assiette de riz, détails : https://www.pexels.com/video/people-holding-plates-with-food-7817118/
          - S3 — service : https://www.pexels.com/video/a-person-serving-food-5657164/
          - S4 — façade stock utilisée comme simulation : https://www.pexels.com/video/front-of-a-restaurant-5293716/
          - Licence : https://www.pexels.com/license/
          EOF
          (cd release && sha256sum * > SHA256SUMS.txt)
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,nb_frames,sample_rate,channels -of json release/VIDEO_T1_BAMAKI_SHALOM_RIZ_AU_GRAS_CALAVI.mp4

      - name: Upload the isolated artifact only
        uses: actions/upload-artifact@v4
        with:
          name: T1-Bamaki-Shalom-Riz-au-Gras-Calavi-${{ github.run_id }}
          path: release/
          if-no-files-found: error
          retention-days: 30
